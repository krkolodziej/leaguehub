name: leaguehub

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaguehub}
      POSTGRES_USER: ${POSTGRES_USER:-leaguehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguehub-local}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - leaguehub_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-leaguehub} -d $${POSTGRES_DB:-leaguehub}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - leaguehub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leaguehub_postgres_data:
  leaguehub_redis_data:
