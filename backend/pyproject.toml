[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leaguehub-backend"
version = "0.1.0"
description = "LeagueHub backend bootstrap"
requires-python = ">=3.13,<3.14"
dependencies = [
    "channels>=4.2,<5",
    "channels-redis>=4.3,<5",
    "daphne>=4.2,<5",
    "Django>=6.0.8,<6.1",
    "django-cors-headers>=4.9,<5",
    "psycopg[binary]>=3.3.4,<3.4",
]

[dependency-groups]
dev = [
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "pytest>=9.1,<10",
    "pytest-django>=4.14,<5",
    "ruff>=0.16.3,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
