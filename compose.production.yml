name: leaguehub-production

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
  POSTGRES_DB: ${POSTGRES_DB:-leaguehub}
  POSTGRES_USER: ${POSTGRES_USER:-leaguehub}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguehub-local}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-only-change-me}
  AI_MATCH_REPORT_PROVIDER: ${AI_MATCH_REPORT_PROVIDER:-template}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaguehub}
      POSTGRES_USER: ${POSTGRES_USER:-leaguehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaguehub-local}
    volumes:
      - leaguehub_postgres_data_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-leaguehub} -d $${POSTGRES_DB:-leaguehub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - leaguehub_redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - leaguehub_media_prod:/app/backend/media
      - leaguehub_static_prod:/app/backend/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker --loglevel=INFO
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat --loglevel=INFO
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    volumes:
      - leaguehub_static_prod:/usr/share/nginx/html/static:ro
      - leaguehub_media_prod:/usr/share/nginx/html/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  leaguehub_postgres_data_prod:
  leaguehub_redis_data_prod:
  leaguehub_media_prod:
  leaguehub_static_prod:
